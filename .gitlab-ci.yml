stages:
  - verify
  - package

verify:
  stage: verify
  image: node:22-bookworm-slim
  script:
    - npm ci --no-audit --no-fund
    - npm run typecheck
    - npm run lint
    - npm test

# Requires a dedicated Docker executor with privileged DinD enabled by its admin.
# This job is MANUAL and limited to the protected default branch.
# It pushes an image only; it does not deploy anything or change site access.
package_image:
  stage: package
  image: docker:28-cli
  services:
    - name: docker:28-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
  script:
    - test -n "$NEXT_PUBLIC_SUPABASE_URL"
    - test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - docker build --pull --build-arg NEXT_PUBLIC_SUPABASE_URL --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  after_script:
    - docker logout "$CI_REGISTRY" || true
